<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>html{background:#06050b}#adSlot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:6px 12px;background:var(--panel2);border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
#adSlot b{border:1px dashed var(--line);border-radius:6px;padding:2px 6px;font-weight:700}
.plans{display:grid;gap:10px;margin:8px 0}
.plan{border:1.5px solid var(--line);border-radius:16px;padding:12px;background:var(--panel2)}
.plan.cur{border-color:var(--acc)}.plan.top{background:linear-gradient(135deg,rgba(124,58,237,.18),rgba(91,140,255,.12))}
.plan h4{margin:0;display:flex;justify-content:space-between;font-size:16px}.plan ul{margin:8px 0;padding-left:18px;color:var(--mute);font-size:13px}
#blocker{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;z-index:100000;display:grid;align-content:center;justify-items:center;gap:12px;padding:28px;text-align:center;color:#efeaff;background:radial-gradient(120% 55% at 10% 0%,rgba(124,58,237,.5),transparent 62%),#06050b}
#blocker img{width:96px;height:96px;border-radius:24px}#blocker h2{margin:0;font-size:22px}#blocker p{margin:0;color:#b9a8ee;max-width:320px}
#blocker button{background:#7c3aed;color:#fff;border-radius:14px;padding:13px 22px;font-weight:700;font-size:15px}
</style>
<title>Pincelar — sua arte, sem limites</title>
<meta name="theme-color" content="#0d0b16">
<meta name="description" content="Pincelar: app de desenho e webtoon com camadas, máscaras, quadros, balões, guias de perspectiva e replay.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pincelar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f1eefa; --panel:#ffffff; --panel2:#f3effb; --line:#dcd5ee; --text:#1b1d22; --mute:#6a6f7b;
  --acc:#7c3aed; --accText:#ffffff; --work:#cfc8e6; --shadow:0 8px 30px rgba(10,15,30,.2); --danger:#d23a3a;
  color-scheme:light dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0b16; --panel:#15121f; --panel2:#201b2e; --line:#2e2742; --text:#efeaff; --mute:#9a92b5;
    --acc:#9a6cff; --accText:#0d0720; --work:#0a0812; --shadow:0 8px 30px rgba(0,0,0,.55); --danger:#ff7676;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0b16; --panel:#15121f; --panel2:#201b2e; --line:#2e2742; --text:#efeaff; --mute:#9a92b5;
  --acc:#9a6cff; --accText:#0d0720; --work:#0a0812; --shadow:0 8px 30px rgba(0,0,0,.55); --danger:#ff7676;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none;
  font:500 14px/1.3 'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#top{display:flex;align-items:center;gap:2px;height:52px;padding:0 6px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
#top .grow{flex:1}
#docTitle{display:flex;flex-direction:column;margin-left:4px;line-height:1.1}
#docTitle b{font-weight:800;font-size:17px;letter-spacing:-.01em}
#docTitle small{font-size:10.5px;color:var(--mute);min-height:12px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:active,.ib.on{background:var(--panel2)}
.ib[disabled]{opacity:.32;pointer-events:none}
.colorbtn{position:relative;width:46px;height:44px;flex:none}
.colorbtn i{position:absolute;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
#dotBg{width:20px;height:20px;right:3px;bottom:5px}
#dotFg{width:28px;height:28px;left:4px;top:6px}
#opts{display:flex;align-items:center;gap:8px;min-height:46px;padding:7px 10px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);flex:none;scrollbar-width:none}
#opts::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 13px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--acc);color:var(--accText);border-color:transparent}
.seg{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.seg button{padding:0 12px;height:32px;font-weight:600;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--accText)}
.hint{color:var(--mute);font-size:13px;white-space:nowrap}
.inl{display:inline-flex;align-items:center;gap:8px;flex:none;font-size:13px;color:var(--mute)}
.inl input[type=range]{width:110px}
#work{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--work)}
#vp{contain:strict;position:absolute;inset:0;touch-action:none;cursor:crosshair;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;
  box-shadow:0 0 0 1px rgba(0,0,0,.25),0 14px 44px rgba(0,0,0,.35);
  background:conic-gradient(#d4d6db 25%,#f6f7f9 0 50%,#d4d6db 0 75%,#f6f7f9 0) 0 0/32px 32px}
#display{display:block;width:100%;height:100%}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#sliders{position:absolute;left:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:22px;z-index:5}
.vs{position:relative;width:30px;height:150px;border-radius:15px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);touch-action:none;overflow:visible}
.vs .fill{position:absolute;left:0;right:0;bottom:0;border-radius:14px;background:var(--acc);opacity:.85;max-height:100%}
.vs .cap{position:absolute;left:0;right:0;top:-18px;text-align:center;font-size:10px;font-weight:700;color:var(--mute);text-shadow:0 0 3px var(--work)}
.vs .bub{position:absolute;left:40px;top:50%;transform:translateY(-50%);background:#101216;color:#fff;border-radius:10px;padding:5px 10px;font-weight:700;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .12s;pointer-events:none}
.vs.act .bub{opacity:1}
.vs.clip{overflow:hidden}
#floatBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);z-index:6}
#zoomChip{position:absolute;right:10px;bottom:10px;z-index:5;box-shadow:var(--shadow);background:var(--panel)}
#cursor{position:fixed;pointer-events:none;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.65);border-radius:50%;transform:translate(-50%,-50%);z-index:9;display:none}
#loupe{position:fixed;width:74px;height:74px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.4);z-index:30;pointer-events:none;transform:translate(-50%,-130%)}
#tools{display:flex;gap:2px;padding:6px 8px;overflow-x:auto;background:var(--panel);border-top:1px solid var(--line);flex:none;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;width:60px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;font-size:10.5px;font-weight:600;color:var(--mute)}
.tool.on{background:var(--panel2);color:var(--acc)}
#sheet{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom,0px));max-height:min(62vh,560px);
  background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 0 16px;height:46px;flex:none}
.sh-head b{font-weight:800;font-size:15px}
.sh-body{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media (min-width:900px){
  #sheet{left:auto;right:14px;top:calc(62px + env(safe-area-inset-top,0px));bottom:84px;width:344px;max-height:none}
}
.sec{margin:14px 0 6px;font-weight:700;font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:40px;padding:0 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--acc);color:var(--accText);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{height:34px;padding:0 11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.menu-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu-list .btn{justify-content:flex-start;height:44px;text-align:left}
.rr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0}
.rr .rl{font-size:13px;font-weight:600}
.rr .val{font-size:12px;color:var(--mute);font-weight:600}
.rr input{grid-column:1/3;width:100%;accent-color:var(--acc);margin:4px 0}
.tg{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-weight:600;border-bottom:1px solid var(--line)}
.tg:last-child{border:0}
.sw-switch{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none}
.sw-switch::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw-switch.on{background:var(--acc)}
.sw-switch.on::after{transform:translateX(18px)}
.lrow{display:flex;align-items:center;gap:8px;padding:6px;border-radius:12px;border:1.5px solid transparent;cursor:pointer}
.lrow.on{background:var(--panel2);border-color:var(--acc)}
.lrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lrow .nm small{display:block;color:var(--mute);font-weight:500;font-size:11px}
.lthumb{width:54px;height:42px;border-radius:7px;border:1px solid var(--line);flex:none;overflow:hidden;
  background:conic-gradient(#cfd2d8 25%,#fff 0 50%,#cfd2d8 0 75%,#fff 0) 0 0/10px 10px}
.lthumb canvas{width:100%;height:100%;display:block}
.sw{width:30px;height:30px;border-radius:9px;border:1px solid rgba(128,128,128,.45);flex:none;position:relative}
.sw.cur{outline:2.5px solid var(--acc);outline-offset:2px}
.sw.cur::after{content:'';position:absolute;right:-5px;top:-5px;width:13px;height:13px;border-radius:50%;background:var(--acc);border:2.5px solid var(--panel);box-shadow:0 0 0 1px var(--acc)}
.swrow{display:flex;gap:7px;flex-wrap:wrap}
#svBox,#hueBar{width:100%;border-radius:12px;display:block;touch-action:none}
#svBox{height:164px}
#hueBar{height:24px;margin-top:10px}
.cdual{display:flex;gap:10px;align-items:center;margin-top:12px}
.cdual .big{width:44px;height:44px;border-radius:12px;border:1px solid rgba(128,128,128,.5);position:relative}
.cdual .big.sel{outline:2px solid var(--acc);outline-offset:2px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:0}
input[type=text]:focus,input[type=number]:focus,textarea:focus,select:focus{border-color:var(--acc)}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bcard{border:1.5px solid var(--line);border-radius:12px;padding:6px;background:var(--panel2);text-align:left}
.bcard{position:relative}.bcard.on{border-color:var(--acc);background:rgba(124,58,237,.18);box-shadow:0 0 0 2px var(--acc) inset}.bcard.on::after{content:'✓';position:absolute;top:6px;right:9px;color:var(--acc);font-weight:800}
.bcard canvas{width:100%;height:36px;display:block;border-radius:6px;background:var(--panel)}
.bcard span{display:block;font-weight:700;font-size:12px;margin-top:4px}
#modal{position:fixed;inset:0;background:rgba(6,9,16,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--panel);border-radius:18px;padding:18px;max-width:440px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.dlg h3{margin:0 0 12px;font-size:17px;font-weight:800}
.dlg .row.end{justify-content:flex-end;margin-top:14px}
.dlg img{max-width:100%;border-radius:10px;display:block;margin:10px auto;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111318;color:#fff;
  padding:9px 15px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;font-weight:600;font-size:13px;max-width:86vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---- camadas: lista, grupos, arrastar ---- */
.llist{position:relative;margin-top:8px}
.lrow{position:relative}
.lrow.ind{margin-left:22px}
.lrow.grp{background:var(--panel2)}
.lrow.dragging{opacity:.45}
.dropline{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--acc);pointer-events:none;z-index:2}
.grip{width:22px;height:40px;display:grid;place-items:center;color:var(--mute);touch-action:none;cursor:grab;flex:none;border-radius:8px}
.gicon{display:grid;place-items:center;width:30px;color:var(--acc);flex:none}
.lthumb.sel{outline:2px solid var(--acc);outline-offset:1px}
.lthumb.mk{background:#000}
/* ---- menu rápido (3 dedos) ---- */
.qm{position:absolute;left:50%;top:14%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,76px);gap:6px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);z-index:12}
.qb{height:68px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;background:var(--panel2)}
.qb:active{background:var(--acc);color:var(--accText)}
/* ---- controles numéricos (cor, curvas) ---- */
.nr{display:grid;grid-template-columns:44px 1fr 58px;gap:8px;align-items:center;margin:6px 0}
.nr .rl{font-size:12px;font-weight:700;color:var(--mute)}
.nr input[type=range]{width:100%;accent-color:var(--acc);margin:0}
.nin{padding:6px 8px!important;text-align:center}
/* ---- redimensionar ---- */
.anchors{display:grid;grid-template-columns:repeat(3,38px);gap:6px;margin:6px 0}
.anc{height:38px;border-radius:9px;background:var(--panel2);border:1.5px solid var(--line)}
.anc.on{background:var(--acc);border-color:transparent}
/* ---- modo limpo ---- */
#cleanExit{display:none;position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);opacity:.45;z-index:40;place-items:center}
#cleanExit:hover,#cleanExit:focus-visible{opacity:1}
body.clean #top,body.clean #opts,body.clean #tools,body.clean #sheet{display:none!important}
body.clean #cleanExit{display:grid}
body.clean #zoomChip{display:none}
#display,#ov{transform:translateZ(0);backface-visibility:hidden}
#sheet,#tools,#opts{contain:layout style}
.wt-note{color:var(--mute);font-size:12px;margin:4px 0 8px}
#splash{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;z-index:99999;background:radial-gradient(120% 55% at 10% 0%,rgba(124,58,237,.5),transparent 62%),radial-gradient(110% 50% at 100% 100%,rgba(91,140,255,.38),transparent 62%),#06050b;display:grid;place-items:center;transition:opacity .45s}#splash img{width:min(80vw,360px);height:auto;-webkit-mask-image:radial-gradient(ellipse at center,#000 55%,transparent 97%);mask-image:radial-gradient(ellipse at center,#000 55%,transparent 97%)}#splash{grid-auto-flow:row;align-content:center;justify-items:center;gap:0}
#splash .sp-bar{width:min(62vw,280px);height:8px;border-radius:6px;background:#241d3a;overflow:hidden;margin-top:6px;box-shadow:0 0 18px rgba(124,58,237,.25)}
#splash .sp-bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#7c3aed,#a78bfa,#5b8cff);transition:width .35s ease;position:relative;overflow:hidden}
#splash .sp-bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:spShine 1.1s infinite}
#splash .sp-txt{margin-top:14px;font:600 14px/1 Manrope,system-ui,sans-serif;color:#b9a8ee;letter-spacing:.04em}
#splash .sp-txt b{display:inline-block;width:1.2em;text-align:left;font-weight:600}
@keyframes spShine{to{transform:translateX(100%)}}
#splash.out{opacity:0;pointer-events:none}
</style>

function cropOf(cv,bb){const c=newCanvas(bb.w,bb.h);c.getContext('2d').drawImage(cv,bb.x,bb.y,bb.w,bb.h,0,0,bb.w,bb.h);return c}
function normBB(b){
  const x0=clamp(Math.floor(b.x),0,S.w-1),y0=clamp(Math.floor(b.y),0,S.h-1);
  const x1=clamp(Math.ceil(b.x+b.w),x0+1,S.w),y1=clamp(Math.ceil(b.y+b.h),y0+1,S.h);
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}
const fullBB=()=>({x:0,y:0,w:S.w,h:S.h});

function pixelEntry(P,bb,before,after,label){
  const pb=mkPix(before),pa=mkPix(after);
  return {label,bytes:0,pix:[pb,pa],touch:[P],
    async undo(){const b=await pixGet(pb);P.ctx.clearRect(bb.x,bb.y,bb.w,bb.h);P.ctx.drawImage(b,bb.x,bb.y)},
    async redo(){const a=await pixGet(pa);P.ctx.clearRect(bb.x,bb.y,bb.w,bb.h);P.ctx.drawImage(a,bb.x,bb.y)}};
}
function runPixelOp(P,bb,fn,label){
  bb=normBB(bb);const before=cropOf(P.canvas,bb);

function maskedOf(src){

function newGroup(name){return {id:++S.groupCount,name:name||('Grupo '+S.groupCount),visible:true,opacity:1,blend:'pass',collapsed:false,locked:false}}

function snapStruct(){return {order:S.layers.slice(),gids:S.layers.map(l=>l.gid),clips:S.layers.map(l=>l.clip),refs:S.layers.map(l=>l.fillRef),groups:S.groups.map(g=>({g,p:{...g}})),ai:S.ai,agid:S.agid}}
function restoreStruct(s){
  S.layers=s.order.slice();s.order.forEach((l,i)=>{l.gid=s.gids[i];l.clip=s.clips[i];l.fillRef=s.refs[i]});
  S.groups=s.groups.map(o=>{Object.assign(o.g,o.p);return o.g});
  S.ai=clamp(s.ai,0,S.layers.length-1);S.agid=s.agid&&groupById(s.agid)?s.agid:0;
  if(S.editMask&&!(activeLayer()&&activeLayer().mk))S.editMask=false;

function structOp(label,fn,bytes=0){
  const b=snapStruct();fn();const a=snapStruct();
  if(sameStruct(b,a)){afterStruct();return}
  pushH({label,bytes,undo(){restoreStruct(b);afterStruct()},redo(){restoreStruct(a);afterStruct()}});
  afterStruct();
}
function sameStruct(a,b){
  if(a.ai!==b.ai||a.agid!==b.agid||a.order.length!==b.order.length||a.groups.length!==b.groups.length)return false;
  for(let i=0;i<a.order.length;i++)if(a.order[i]!==b.order[i]||a.gids[i]!==b.gids[i]||a.clips[i]!==b.clips[i]||a.refs[i]!==b.refs[i])return false;
  for(let i=0;i<a.groups.length;i++)if(a.groups[i].g!==b.groups[i].g)return false;

}
function afterStruct(){layersChanged();renderOpts();updateSliders()}

function duplicateLayer(){

function deleteLayer(){

    redo(){const i=S.layers.indexOf(L);if(i>=0)S.layers.splice(i,1);S.ai=clamp(newAi,0,S.layers.length-1);S.editMask=false}});

/* mover para cima (+1) / baixo (-1), respeitando blocos de grupo */
function moveLayer(dir){
  if(S.float)applyFloat();
  const i=S.ai,L=S.layers[i],j=i+dir;if(j<0||j>=S.layers.length)return;
  const N=S.layers[j];
  structOp('Mover camada',()=>{
    if(L.gid){
      if(N.gid===L.gid){S.layers[i]=N;S.layers[j]=L;S.ai=j}
      else{L.gid=0}                      // sai do grupo na borda
    }else if(N.gid){                      // pula o bloco inteiro do grupo
      let k=j;while(k>=0&&k<S.layers.length&&S.layers[k].gid===N.gid)k+=dir;
      k-=dir;S.layers.splice(i,1);S.layers.splice(k,0,L);S.ai=k;
    }else{S.layers[i]=N;S.layers[j]=L;S.ai=j}
  });
}
/* arrastar: spec={layer|group, gap (índice antes da remoção), into (id do grupo)} */
function dragMove(spec){
  if(S.float)applyFloat();
  const cur=activeLayer();
  structOp('Reordenar',()=>{
    if(spec.layer){
      const L=spec.layer,i=S.layers.indexOf(L);let gap=spec.gap;
      S.layers.splice(i,1);if(gap>i)gap--;
      S.layers.splice(gap,0,L);
      if(spec.into)L.gid=spec.into;
      else{const A=S.layers[gap+1],B=S.layers[gap-1];L.gid=(A&&B&&A.gid&&A.gid===B.gid)?A.gid:0}
    }else{
      const g=spec.group,mem=S.layers.filter(l=>l.gid===g.id);if(!mem.length)return;
      let gap=spec.gap;const before=S.layers.slice();
      let removedBefore=0;for(const m of mem)if(before.indexOf(m)<gap)removedBefore++;
      gap-=removedBefore;S.layers=S.layers.filter(l=>l.gid!==g.id);
      const A=S.layers[gap],B=S.layers[gap-1];
      if(A&&B&&A.gid&&A.gid===B.gid){let k=gap;while(k<S.layers.length&&S.layers[k].gid===A.gid)k++;gap=k}
      S.layers.splice(gap,0,...mem);
    }
    S.ai=Math.max(0,S.layers.indexOf(cur));
  });
}
function mergeDown(){

  if(L.gid!==B.gid){toast('Só é possível mesclar camadas do mesmo grupo');return}
  const before=cropOf(B.canvas,fullBB()),oldMk=B.mk,wasEdit=S.editMask;
  if(B.mk){B.ctx.save();B.ctx.globalCompositeOperation='destination-in';B.ctx.drawImage(B.mk.canvas,0,0);B.ctx.restore();B.mk=null}

      u.globalCompositeOperation='destination-in';u.drawImage(B.canvas,0,0);u.globalCompositeOperation='source-over';src=U;
    }

    async undo(){const b=await pixGet(pb);B.ctx.clearRect(0,0,S.w,S.h);B.ctx.drawImage(b,0,0);B.mk=oldMk;S.layers.splice(idx,0,L);S.ai=idx;S.editMask=wasEdit&&!!L.mk},
    async redo(){const a=await pixGet(pa);B.ctx.clearRect(0,0,S.w,S.h);B.ctx.drawImage(a,0,0);B.mk=null;const i=S.layers.indexOf(L);if(i>=0)S.layers.splice(i,1);S.ai=idx-1;S.editMask=false}});
  layersChanged();renderOpts();
}

function deleteGroup(g){
  const n=S.layers.filter(l=>l.gid===g.id).length;
  structOp('Excluir grupo',()=>{
    const cur=activeLayer();
    S.layers=S.layers.filter(l=>l.gid!==g.id);S.groups=S.groups.filter(x=>x!==g);S.agid=0;
    if(!S.layers.length){const L=newLayer();S.layers.push(L)}
    S.ai=cur&&S.layers.includes(cur)?S.layers.indexOf(cur):clamp(S.ai,0,S.layers.length-1);S.editMask=false;

function ungroupLayer(L){
  if(!L.gid)return;
  structOp('Tirar do grupo',()=>{
    const gid=L.gid,i=S.layers.indexOf(L);S.layers.splice(i,1);
    let k=i;while(k<S.layers.length&&S.layers[k].gid===gid)k++;

    S.layers.splice(k,0,L);L.gid=0;S.ai=k;
  });

function mergeGroup(g){
  const mem=S.layers.filter(l=>l.gid===g.id);if(!mem.length)return;
  if(S.float)applyFloat();
  const N=newLayer(g.name);
  N.opacity=g.opacity;N.blend=g.blend==='pass'?'source-over':g.blend;N.visible=g.visible;
  compositeInto(N.ctx,mem);
  structOp('Mesclar grupo',()=>{
    const top=S.layers.indexOf(mem[mem.length-1]);

    S.layers.splice(clamp(top-mem.length+1,0,S.layers.length),0,N);S.ai=S.layers.indexOf(N);S.editMask=false;
  },mem.length*S.w*S.h*4);

/* superfície da camada com máscara, flutuante e traço ao vivo aplicados */
function surfaceOf(L,live){
  let src=L.canvas,msk=(L.mk&&L.maskOn)?L.mk.canvas:null;
  if(live&&live.layer===L){if(live.plane==='mask')msk=live.canvas;else src=live.canvas}
  if(S.float&&S.float.layer===L){
    const f=scratch('fl'),c=f.getContext('2d');
    c.globalCompositeOperation='copy';c.globalAlpha=1;c.drawImage(src,0,0);c.globalCompositeOperation='source-over';
    drawFloatInto(c,S.float);src=f;
  }
  if(!msk)return src;
  const m=scratch('lm'),c=m.getContext('2d');rc(c);
  c.globalCompositeOperation='copy';c.globalAlpha=1;c.drawImage(src,0,0);
  c.globalCompositeOperation='destination-in';c.drawImage(msk,0,0);c.globalCompositeOperation='source-over';
  ru(c);return m;

  for(let i=0;i<a.length;i++)d[i*4+3]=a[i]<0?0:a[i]>255?255:a[i];
  c.putImageData(od,0,0);return out;
}
function blurAlpha(a,w,h,r){
  r=Math.max(1,Math.round(r/1.7));const tmp=new Float32Array(a.length),dd=2*r+1;
  for(let pass=0;pass<3;pass++){
    for(let y=0;y<h;y++){const row=y*w;let sum=0;for(let i=-r;i<=r;i++)sum+=a[row+Math.min(w-1,Math.max(0,i))];
      for(let x=0;x<w;x++){tmp[row+x]=sum/dd;sum+=a[row+Math.min(w-1,x+r+1)]-a[row+Math.max(0,x-r)]}}
    for(let x=0;x<w;x++){let sum=0;for(let i=-r;i<=r;i++)sum+=tmp[Math.min(h-1,Math.max(0,i))*w+x];
      for(let y=0;y<h;y++){a[y*w+x]=sum/dd;sum+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x]}}
  }
}
/* transformada de distância euclidiana (Felzenszwalb): grid=0 nos sítios, grande no resto; devolve distância² */
function edt2d(grid,w,h){
  const n=Math.max(w,h),f=new Float64Array(n),d=new Float64Array(n),v=new Int32Array(n),z=new Float64Array(n+1);
  const one=len=>{
    let k=0;v[0]=0;z[0]=-1e30;z[1]=1e30;
    for(let q=1;q<len;q++){
      let s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);
      while(s<=z[k]){k--;s=((f[q]+q*q)-(f[v[k]]+v[k]*v[k]))/(2*q-2*v[k])}
      k++;v[k]=q;z[k]=s;z[k+1]=1e30;
    }
    k=0;for(let q=0;q<len;q++){while(z[k+1]<q)k++;d[q]=(q-v[k])*(q-v[k])+f[v[k]]}
  };
  for(let x=0;x<w;x++){for(let y=0;y<h;y++)f[y]=grid[y*w+x];one(h);for(let y=0;y<h;y++)grid[y*w+x]=d[y]}
  for(let y=0;y<h;y++){for(let x=0;x<w;x++)f[x]=grid[y*w+x];one(w);for(let x=0;x<w;x++)grid[y*w+x]=d[x]}
}
function refineSelection(kind,val){
  if(!S.sel){toast('Faça uma seleção primeiro');return}
  const w=S.w,h=S.h,a=readAlpha(S.sel.mask),n=w*h;let out;
  if(kind==='feather'){blurAlpha(a,w,h,val);out=a}
  else if(kind==='smooth'){
    blurAlpha(a,w,h,val);
    for(let i=0;i<n;i++)a[i]=clamp(((a[i]/255-.5)*5+.5),0,1)*255;out=a;
  }else if(kind==='grow'||kind==='shrink'){
    const INF=1e12,g=new Float32Array(n);
    if(kind==='grow'){
      for(let i=0;i<n;i++)g[i]=a[i]>127?0:INF;edt2d(g,w,h);
      out=new Float32Array(n);for(let i=0;i<n;i++)out[i]=clamp(val+.5-Math.sqrt(g[i]),0,1)*255;
    }else{
      for(let i=0;i<n;i++)g[i]=a[i]>127?INF:0;edt2d(g,w,h);
      out=new Float32Array(n);
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){
        const i=y*w+x;let d=Math.sqrt(g[i]);
        d=Math.min(d,x+1,w-x,y+1,h-y);
        out[i]=a[i]>127?clamp(d-val+.5,0,1)*255:0;
      }
    }
  }else return;
  S.sel={mask:alphaToCanvas(out)};buildSelVisual();requestOverlay();renderOpts();
}
function selectFromLayer(){
  const L=activeLayer(),m=newCanvas(S.w,S.h);m.getContext('2d').drawImage(surfaceOf(L,null),0,0);
  const c=m.getContext('2d');c.globalCompositeOperation='source-in';c.fillStyle='#000';c.fillRect(0,0,S.w,S.h);
  if(!S.sel||S.selOp==='new')S.sel={mask:m};else combineSelection(m);
  buildSelVisual();requestOverlay();renderOpts();
}
function zoomToSelection(){
  if(!S.sel){toast('Sem seleção');return}
  const bb=maskBounds(S.sel.mask);if(!bb){toast('Seleção vazia');return}
  fitRect(bb);
}

const TIPS=new Map(),TIPLOAD=new Set();
const tipKey=c=>c.tip?c.tip+(c.tipInv?'|i':''):null;
async function loadTip(cfg){
  const url=cfg&&cfg.tip;if(!url)return;const key=tipKey(cfg);
  if(TIPS.has(key)||TIPLOAD.has(key))return;TIPLOAD.add(key);
  try{
    const img=url.indexOf('proc:')===0?procTip(url.slice(5)):await loadImg(url),N=256,sc=Math.min(N/img.width,N/img.height),w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));
    const cv=newCanvas(N,N),x=cv.getContext('2d'),x0=Math.floor((N-w)/2),y0=Math.floor((N-h)/2);
    x.drawImage(img,x0,y0,w,h);
    const id=x.getImageData(0,0,N,N),d=id.data;
    let tr=0,tot=0;
    for(let yy=y0;yy<y0+h;yy++)for(let xx=x0;xx<x0+w;xx++){tot++;if(d[(yy*N+xx)*4+3]<250)tr++}
    const useAlpha=tr/Math.max(1,tot)>.02;
    for(let i=0;i<d.length;i+=4){
      const a=d[i+3];let v;
      if(useAlpha)v=a;else{const lum=.299*d[i]+.587*d[i+1]+.114*d[i+2];v=(cfg.tipInv?lum:255-lum)*a/255}
      d[i]=d[i+1]=d[i+2]=0;d[i+3]=v;
    }
    x.putImageData(id,0,0);TIPS.set(key,cv);
  }catch(e){}
  TIPLOAD.delete(key);
  if(sheetName==='brush')renderSheet();
}

function procTip(kind){
  const N=256,c=newCanvas(N,N),x=c.getContext('2d'),id=x.createImageData(N,N),d=id.data,R=N/2-4,col=[];
  for(let i=0;i<N;i++)col.push(Math.random());
  const put=(px,py,a)=>{const k=(py*N+px)*4;d[k+3]=Math.max(0,Math.min(255,a))};
  if(kind==='stipple'){for(let i=0;i<26;i++){const a=Math.random()*6.283,r=Math.sqrt(Math.random())*R*.9,cx=N/2+Math.cos(a)*r,cy=N/2+Math.sin(a)*r,rr=3+Math.random()*7;
    for(let y=Math.floor(cy-rr);y<=cy+rr;y++)for(let xx=Math.floor(cx-rr);xx<=cx+rr;xx++){if(xx<0||xx>=N||y<0||y>=N)continue;const dd=Math.hypot(xx-cx,y-cy);if(dd<=rr)put(xx,y,255*(1-dd/rr*.4))}}}
  else for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){
    const dd=Math.hypot(xx-N/2,y-N/2);if(dd>R)continue;const edge=Math.min(1,(R-dd)/(R*.18));let a;
    if(kind==='chalk')a=Math.random()<.55?(.45+.55*Math.random()):0;
    else if(kind==='crayon'){const v=col[xx]*.7+Math.random()*.5;a=v>.42?Math.min(1,v):0}
    else if(kind==='bristle'){const v=col[xx];a=v<.22?0:(.55+.45*Math.random())*(v>.5?1:.7)}
    else a=1;
    put(xx,y,a*edge*255)}
  x.putImageData(id,0,0);return c;
}
function makeStamp(size,hard,rgb,tip){
  const D=Math.max(2,Math.ceil(size)),c=newCanvas(D,D),x=c.getContext('2d'),r=D/2;
  const col=a=>`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`;
  if(tip&&TIPS.has(tip)){
    x.imageSmoothingQuality='high';x.drawImage(TIPS.get(tip),0,0,D,D);
    x.globalCompositeOperation='source-in';x.fillStyle=col(1);x.fillRect(0,0,D,D);
    return c;
  }
  if(hard>=.97){x.fillStyle=col(1);x.beginPath();x.arc(r,r,r,0,Math.PI*2);x.fill()}
  else{
    const g=x.createRadialGradient(r,r,0,r,r,r),i=Math.max(.001,hard);
    g.addColorStop(0,col(1));g.addColorStop(i,col(1));
    for(let k=1;k<=5;k++){const t=k/5,a=1-t*t*(3-2*t);g.addColorStop(i+(1-i)*t,col(a))}
    x.fillStyle=g;x.fillRect(0,0,D,D);
  }
  return c;
}
function symPts(x,y){
  const w=S.w,h=S.h;
  switch(S.sym){
    case 'v':return [[x,y],[w-x,y]];
    case 'h':return [[x,y],[x,h-y]];
    case 'q':return [[x,y],[w-x,y],[x,h-y],[w-x,h-y]];
    case 'r':{const cx=w/2,cy=h/2,out=[];for(let k=0;k<6;k++){const a=k*Math.PI/3,c=Math.cos(a),s=Math.sin(a),dx=x-cx,dy=y-cy;out.push([cx+dx*c-dy*s,cy+dx*s+dy*c])}return out}
    default:return [[x,y]];
  }
}
function expandBB(st,x,y,r){
  const b=st.bb||(st.bb={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9});
  if(x-r<b.x0)b.x0=x-r;if(y-r<b.y0)b.y0=y-r;if(x+r>b.x1)b.x1=x+r;if(y+r>b.y1)b.y1=y+r;
  const d=st.dr||(st.dr={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9});
  if(x-r<d.x0)d.x0=x-r;if(y-r<d.y0)d.y0=y-r;if(x+r>d.x1)d.x1=x+r;if(y+r>d.y1)d.y1=y+r;
}
function stampAt(x,y,pr,tl){
  const st=stroke,c=st.cfg,tm=tl?tl.m:0;
  const sz=Math.max(.6,c.size*(1-c.pSize+c.pSize*pr)*(1+(c.tilt||0)*tm*1.6));
  let a=c.flow*(1-c.pOpa+c.pOpa*pr)*(1-(c.tilt||0)*tm*.55);
  if(c.grain)a*=1-c.grain*Math.random()*.9;
  if(c.scatter){const ang=Math.random()*6.283,r=Math.random()*sz*c.scatter;x+=Math.cos(ang)*r;y+=Math.sin(ang)*r}
  const stp=st.metal?metalStamp(st,x,y):st.stamp;
  const ctx=st.sc||(st.sc=sctx('stroke'));ctx.globalAlpha=clamp(a,0,1);
  const tilted=c.tilt&&tm>.05,rot=(c.tipRot||0)*Math.PI/180+(c.tipFollow?st.dir:0)+(tilted?tl.a:0),sx=tilted?1+c.tilt*tm*1.2:1;
  if(rot||sx!==1){
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sx,1);ctx.drawImage(stp,-sz/2,-sz/2,sz,sz);ctx.restore();
  }else ctx.drawImage(stp,x-sz/2,y-sz/2,sz,sz);
  ctx.globalAlpha=1;
  const rad=(rot||sx!==1||st.cfg.tip)?sz*.75*Math.max(1,sx):sz/2;
  expandBB(st,x,y,rad+2+(c.scatter?sz*c.scatter:0));
}
function smudgeAt(x,y,pr){
  const st=stroke,c=st.cfg,P=st.plane,D=st.D,sx=Math.round(x-D/2),sy=Math.round(y-D/2);
  const strength=clamp(c.opacity*(1-c.pOpa+c.pOpa*pr),.02,1);
  st.pctx.globalCompositeOperation='copy';st.pctx.globalAlpha=1;st.pctx.drawImage(P.canvas,sx,sy,D,D,0,0,D,D);st.pctx.globalCompositeOperation='source-over';
  if(!st.carryInit){st.cctx.clearRect(0,0,D,D);st.cctx.drawImage(st.pre,0,0);st.carryInit=true;return}
  const t=st.tctx;t.globalCompositeOperation='copy';t.globalAlpha=1;t.drawImage(st.carry,0,0);
  t.globalCompositeOperation='destination-in';t.drawImage(st.stamp,0,0,D,D);t.globalCompositeOperation='source-over';
  const lc=P.ctx;lc.save();lc.globalAlpha=strength;lc.globalCompositeOperation=(P===st.layer&&st.layer.alphaLock)?'source-atop':'source-over';lc.drawImage(st.tc,sx,sy);lc.restore();
  const k=1-clamp(c.carry==null?.7:c.carry,0,.97);
  st.cctx.globalAlpha=clamp(k*(.5+.5*strength)+.05,.05,1);st.cctx.drawImage(st.pre,0,0);st.cctx.globalAlpha=1;

function emit(x,y,pr,tl){
  const st=stroke;
  if(st.mode==='smudge'){smudgeAt(x,y,pr);return}
  if(S.sym==='off'){stampAt(x,y,pr,tl);return}
  for(const [px,py] of symPts(x,y))stampAt(px,py,pr,tl);
}
function strokeTo(x,y,pr,tl){
  const st=stroke,c=st.cfg;
  if(!st.last){st.last={x,y,pr,tl};emit(x,y,pr,tl);st.rem=Math.max(.75,c.size*c.spacing);return}
  const dx=x-st.last.x,dy=y-st.last.y,d=Math.hypot(dx,dy);if(d<.01)return;
  st.dir=Math.atan2(dy,dx);
  const step=Math.max(.75,c.size*(1-c.pSize+c.pSize*pr)*c.spacing);
  let pos=st.rem;const m0=st.last.tl?st.last.tl.m:0,m1=tl?tl.m:0;
  while(pos<=d){const t=pos/d;emit(st.last.x+dx*t,st.last.y+dy*t,lerp(st.last.pr,pr,t),{m:lerp(m0,m1,t),a:tl?tl.a:0});pos+=step}
  st.rem=pos-d;st.last={x,y,pr,tl};
}
/* suavização + corda de estabilização */
function feedRaw(x,y,pr,tl){
  const st=stroke,c=st.cfg;
  if(c.rope>0){
    const rp=st.rp,d=Math.hypot(x-rp.x,y-rp.y),rr=c.rope/Math.max(.2,S.view.s)*.0+c.rope;
    if(d>rr){const k=(d-rr)/d;rp.x+=(x-rp.x)*k;rp.y+=(y-rp.y)*k}
    S.ropeLine={a:{x:rp.x,y:rp.y},b:{x,y}};requestOverlay();
    x=rp.x;y=rp.y;
  }
  const k=1-clamp(c.smooth,0,.95)*.9;
  st.raw={x,y,pr,tl};
  st.sm.x+=(x-st.sm.x)*k;st.sm.y+=(y-st.sm.y)*k;st.sm.pr+=(pr-st.sm.pr)*Math.max(k,.35);st.sm.tm+=(tl.m-st.sm.tm)*.4;
  strokeTo(st.sm.x,st.sm.y,st.sm.pr,{m:st.sm.tm,a:tl.a});
}
function feed(x,y,pr,tl){
  const st=stroke;
  if(st.gd&&!st.first){const g=guideApply(st,x,y);if(!g)return;x=g.x;y=g.y}
  st.pts.push({x,y,pr,tl});
  feedRaw(x,y,pr,tl);
  st.first=false;
}
function renderLine(st,p){
  sctx('stroke').clearRect(0,0,S.w,S.h);st.bb=null;st.last=null;st.rem=0;
  const tl={m:0,a:0};
  strokeTo(st.line.a.x,st.line.a.y,st.line.pr,tl);strokeTo(p.x,p.y,st.line.pr,tl);
  st.line.b={x:p.x,y:p.y};st.raw={x:p.x,y:p.y,pr:st.line.pr,tl};
}
function startStroke(p){
  const L=activeLayer();
  if(!layerVisible(L)){toast('A camada está oculta');return false}
  if(layerLocked(L)){toast('A camada está bloqueada');return false}
  if(S.float)applyFloat();
  const P=planeOf(L),tool=S.tool,cfg=cfgOf(tool);
  if(tool==='liquify'){
    if(P!==L){toast('Saia da máscara para usar o Deformar');return false}
    return startLiquify(p);
  }
  const mode=tool==='eraser'?'erase':tool==='smudge'?'smudge':'paint';
  const rgb=mode==='paint'?(P!==L?[255,255,255]:fgRGB()):[0,0,0];
  const st={tool,cfg,mode,layer:L,plane:P,bb:null,last:null,rem:0,sm:{x:p.x,y:p.y,pr:p.pr,tm:p.tilt.m},rgb,
    stamp:makeStamp(cfg.size,cfg.hardness,rgb,tipKey(cfg)),metal:(mode==='paint'&&P===L&&S.metal)?S.metal:null,pts:[],dir:0,first:true,rp:{x:p.x,y:p.y},simple:simpleStack(),
    gd:null,line:null,snapped:null,qsAnchor:{x:p.x,y:p.y},qsTimer:0};
  if(mode==='smudge'){
    st.D=Math.max(2,Math.ceil(cfg.size));
    st.carry=newCanvas(st.D,st.D);st.cctx=st.carry.getContext('2d');
    st.tc=newCanvas(st.D,st.D);st.tctx=st.tc.getContext('2d');
    st.pre=newCanvas(st.D,st.D);st.pctx=st.pre.getContext('2d');
    st.before=newCanvas(S.w,S.h);st.before.getContext('2d').drawImage(P.canvas,0,0);
  }else{
    const sc=sctx('stroke');sc.setTransform(1,0,0,1,0,0);sc.clearRect(0,0,S.w,S.h);
    if(st.simple)buildCacheBelow();
  }
  if(mode!=='smudge'&&(S.straight!=='off'||p.shift)){
    const chain=(S.straight==='chain'||p.shift)&&S.lastEnd;
    st.line={a:chain?{x:S.lastEnd.x,y:S.lastEnd.y}:{x:p.x,y:p.y},pr:p.type==='pen'?Math.max(p.pr,.5):1,b:{x:p.x,y:p.y}};
  }else guideSetup(st,p);
  stroke=st;strokeLive=mode!=='smudge';
  if(mode==='paint'&&P===L)pushColorHistory();
  if(st.line)renderLine(st,p);
  else{feed(p.x,p.y,p.pr,p.tilt);st.first=false}
  requestRender();return true;
}
function moveStroke(p){
  const st=stroke;if(!st)return;
  if(st.liq){liqMove(p);return}
  if(st.line){renderLine(st,p);st.dr={x0:0,y0:0,x1:S.w,y1:S.h};requestRenderStroke();return}
  if(st.snapped){qsAdjust(st,p);st.dr={x0:0,y0:0,x1:S.w,y1:S.h};requestRenderStroke();return}
  feed(p.x,p.y,p.pr,p.tilt);
  qsArm(st,p);
  requestRenderStroke();
}
function endStroke(){
  const st=stroke;if(!st)return;
  clearTimeout(st.qsTimer);S.ropeLine=null;requestOverlay();
  if(st.liq){endLiquify(st);return}
  if(st.raw&&!st.line&&!st.snapped&&!(st.cfg.rope>0)){for(let i=0;i<30;i++){if(Math.hypot(st.raw.x-st.sm.x,st.raw.y-st.sm.y)<.6)break;feedRaw(st.raw.x,st.raw.y,st.raw.pr,st.raw.tl)}}
  if(st.line)S.lastEnd={x:st.line.b.x,y:st.line.b.y};
  else if(st.snapped)S.lastEnd=st.snapped.end?{x:st.snapped.end.x,y:st.snapped.end.y}:S.lastEnd;
  else if(st.raw)S.lastEnd={x:st.raw.x,y:st.raw.y};
  stroke=null;strokeLive=false;
  const L=st.layer,P=st.plane;
  if(!st.bb){requestRender();return}
  const bb=normBB({x:st.bb.x0,y:st.bb.y0,w:st.bb.x1-st.bb.x0,h:st.bb.y1-st.bb.y0});
  if(st.mode==='smudge'){
    const before=cropOf(st.before,bb);
    if(S.sel){
      const a=sctx('tmp');a.globalCompositeOperation='copy';a.drawImage(P.canvas,0,0);
      a.globalCompositeOperation='destination-in';a.drawImage(S.sel.mask,0,0);a.globalCompositeOperation='source-over';
      const lc=P.ctx;lc.clearRect(0,0,S.w,S.h);lc.drawImage(st.before,0,0);
      lc.globalCompositeOperation='destination-out';lc.drawImage(S.sel.mask,0,0);lc.globalCompositeOperation='source-over';lc.drawImage(scratch('tmp'),0,0);
    }
    pushH(pixelEntry(P,bb,before,cropOf(P.canvas,bb),'Borrar'));
  }else{
    const before=cropOf(P.canvas,bb),ctx=P.ctx;
    ctx.save();ctx.globalAlpha=st.cfg.opacity;
    ctx.globalCompositeOperation=st.mode==='erase'?'destination-out':((P===L&&L.alphaLock)?'source-atop':'source-over');
    ctx.drawImage(S.sel?maskedOf(scratch('stroke')):scratch('stroke'),bb.x,bb.y,bb.w,bb.h,bb.x,bb.y,bb.w,bb.h);ctx.restore();
    pushH(pixelEntry(P,bb,before,cropOf(P.canvas,bb),P===L?'Traço':'Máscara'));
  }

}
function cancelStroke(){

let liqOrig=null;
function startLiquify(p){

  if(!liqOrig||liqOrig.L!==L||liqOrig.rev!==L.rev)liqOrig={L,rev:L.rev,data:new Uint8ClampedArray(id.data)};
  const st={tool:'liquify',mode:'liquify',liq:true,cfg:S.cfgs.liquify,layer:L,plane:L,id,last:{x:p.x,y:p.y},bb:null,timer:0,pts:[],first:false,
    before:newCanvas(w,h)};

/* ================= guias (régua / perspectiva) e QuickShape ================= */

    const a=g.ruler.a,b=g.ruler.b,l=Math.hypot(b.x-a.x,b.y-a.y)||1,dx=(b.x-a.x)/l,dy=(b.y-a.y)/l;

    const a=g.ruler.a,b=g.ruler.b,l=Math.hypot(b.x-a.x,b.y-a.y)||1,dx=(b.x-a.x)/l,dy=(b.y-a.y)/l;

/* ---------- QuickShape: segurar no fim do traço endireita a forma ---------- */
function distSeg(p,a,b){

function distLine(p,a,b){

/* ================= preencher / gradiente / formas ================= */

let picking=false,pickCtx=null,pickRaf=0,pickPt=null;
/* tira uma "foto" da imagem ao tocar; depois as leituras são instantâneas (sem re-renderizar) */
function pickSnapshot(){
  let src;
  if(S.eye.src==='layer'){const L=activeLayer();src=(S.editMask&&L.mk)?L.mk.canvas:copySurface(L)}
  else{needFull=true;render();src=disp}
  const c=document.createElement('canvas');c.width=S.w;c.height=S.h;
  pickCtx=c.getContext('2d',{willReadFrequently:true});pickCtx.drawImage(src,0,0);
}
function sampleAt(p){
  if(!pickCtx)pickSnapshot();
  const x=Math.floor(p.x),y=Math.floor(p.y);
  if(x<0||y<0||x>=S.w||y>=S.h)return null;
  const n=S.eye.avg,r=(n-1)>>1,x0=Math.max(0,x-r),y0=Math.max(0,y-r),x1=Math.min(S.w,x+r+1),y1=Math.min(S.h,y+r+1);
  const d=pickCtx.getImageData(x0,y0,x1-x0,y1-y0).data;
  let R=0,G=0,B=0,A=0;
  for(let i=0;i<d.length;i+=4){const a=d[i+3];R+=d[i]*a;G+=d[i+1]*a;B+=d[i+2]*a;A+=a}
  if(A===0)return [255,255,255];
  return [Math.round(R/A),Math.round(G/A),Math.round(B/A)];
}
function pickPaint(){
  pickRaf=0;const p=pickPt;if(!p||!picking)return;
  const c=sampleAt(p);if(!c)return;
  loupe.hidden=false;loupe.style.background=toHex(...c);loupe.style.left=p.cx+'px';loupe.style.top=p.cy+'px';loupe._c=c;
}
function pickMove(p){
  pickPt=p;
  if(!pickCtx){pickSnapshot();pickPaint();return}   // primeiro toque responde na hora
  if(!pickRaf)pickRaf=requestAnimationFrame(pickPaint);
}
function pickEnd(){
  if(pickPt)pickPaint();
  const ptT=pickPt;loupe.hidden=true;picking=false;pickCtx=null;pickPt=null;
  if(loupe._c){setColorRGB(...loupe._c);loupe._c=null}

/* ================= texto / imagem / transformação ================= */
function floatCorners(f){
  const hw=f.canvas.width*f.s/2,hh=f.canvas.height*f.s/2,c=Math.cos(f.rot),s=Math.sin(f.rot),fl=f.flip?-1:1;
  return [[-hw*fl,-hh],[hw*fl,-hh],[hw*fl,hh],[-hw*fl,hh]].map(([px,py])=>({x:f.x+px*c-py*s,y:f.y+px*s+py*c}));
}
/* projeção unitário → quadrilátero (homografia) */
function quadH(q){
  const [p0,p1,p2,p3]=q,sx=p0.x-p1.x+p2.x-p3.x,sy=p0.y-p1.y+p2.y-p3.y;
  let g=0,h=0;
  if(Math.abs(sx)>1e-9||Math.abs(sy)>1e-9){
    const dx1=p1.x-p2.x,dx2=p3.x-p2.x,dy1=p1.y-p2.y,dy2=p3.y-p2.y,den=dx1*dy2-dx2*dy1||1e-9;
    g=(sx*dy2-dx2*sy)/den;h=(dx1*sy-sx*dy1)/den;
  }
  const a=p1.x-p0.x+g*p1.x,b=p3.x-p0.x+h*p3.x,c=p0.x,d=p1.y-p0.y+g*p1.y,e=p3.y-p0.y+h*p3.y,f=p0.y;
  return (u,v)=>{const w=g*u+h*v+1;return {x:(a*u+b*v+c)/w,y:(d*u+e*v+f)/w}};
}
function drawTri(ctx,img,s0,s1,s2,d0,d1,d2){
  const det=(s1.x-s0.x)*(s2.y-s0.y)-(s2.x-s0.x)*(s1.y-s0.y);if(!det)return;
  const a=((d1.x-d0.x)*(s2.y-s0.y)-(d2.x-d0.x)*(s1.y-s0.y))/det;
  const b=((d1.y-d0.y)*(s2.y-s0.y)-(d2.y-d0.y)*(s1.y-s0.y))/det;
  const c=((d2.x-d0.x)*(s1.x-s0.x)-(d1.x-d0.x)*(s2.x-s0.x))/det;
  const d=((d2.y-d0.y)*(s1.x-s0.x)-(d1.y-d0.y)*(s2.x-s0.x))/det;
  const e=d0.x-a*s0.x-c*s0.y,f=d0.y-b*s0.x-d*s0.y;
  const cx=(d0.x+d1.x+d2.x)/3,cy=(d0.y+d1.y+d2.y)/3,ex=p=>{const dx=p.x-cx,dy=p.y-cy,l=Math.hypot(dx,dy)||1;return {x:p.x+dx/l*.7,y:p.y+dy/l*.7}};
  const E0=ex(d0),E1=ex(d1),E2=ex(d2);
  ctx.save();ctx.beginPath();ctx.moveTo(E0.x,E0.y);ctx.lineTo(E1.x,E1.y);ctx.lineTo(E2.x,E2.y);ctx.closePath();ctx.clip();
  ctx.transform(a,b,c,d,e,f);ctx.drawImage(img,0,0);ctx.restore();
}
function drawQuad(ctx,img,q,N=14){
  const H=quadH(q),iw=img.width,ih=img.height;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const u0=i/N,u1=(i+1)/N,v0=j/N,v1=(j+1)/N;
    const A=H(u0,v0),B=H(u1,v0),C=H(u1,v1),D=H(u0,v1);
    const sA={x:u0*iw,y:v0*ih},sB={x:u1*iw,y:v0*ih},sC={x:u1*iw,y:v1*ih},sD={x:u0*iw,y:v1*ih};
    drawTri(ctx,img,sA,sB,sC,A,B,C);drawTri(ctx,img,sA,sC,sD,A,C,D);
  }
}
function drawFloatInto(c,f){

function floatBounds(f){

    const hw=f.canvas.width*f.s/2,hh=f.canvas.height*f.s/2,c=Math.cos(f.rot),s=Math.sin(f.rot);

  }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const p of pts){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)}

let floatDrag=null;
function floatDown(p){
  const f=S.float;if(!f)return;
  if(f.q){
    const r=28/S.view.s;
    for(let i=0;i<4;i++)if(dist(p,f.q[i])<r){floatDrag={t:'qc',i,p0:{x:p.x,y:p.y},q0:f.q.map(q=>({...q}))};return}
    floatDrag={t:'qm',p0:{x:p.x,y:p.y},q0:f.q.map(q=>({...q}))};return;
  }
  const hw=f.canvas.width*f.s/2,hh=f.canvas.height*f.s/2,c=Math.cos(f.rot),s=Math.sin(f.rot),off=40/S.view.s,r=26/S.view.s;
  const rotH={x:f.x+(hh+off)*s,y:f.y-(hh+off)*c};

  if(dist(p,rotH)<r)floatDrag={t:'rot',a0:Math.atan2(p.y-f.y,p.x-f.x),rot0:f.rot};
  else if(pts.some(q=>dist(p,q)<r))floatDrag={t:'scale',d0:Math.max(1,dist(p,f)),s0:f.s};
  else floatDrag={t:'move',px:p.x,py:p.y,x0:f.x,y0:f.y};
}
function floatMove(p){

  else if(d.t==='qc'){
    const dx=p.x-d.p0.x,dy=p.y-d.p0.y;f.q=d.q0.map(q=>({...q}));
    f.q[d.i]={x:d.q0[d.i].x+dx,y:d.q0[d.i].y+dy};

function drawFloatOverlay(x,k){

/* arrastar para reordenar camadas/grupos */
function startLayerDrag(e,item,list,rowEls,items){
  e.preventDefault();e.stopPropagation();
  const handle=e.currentTarget;try{handle.setPointerCapture(e.pointerId)}catch(_){}
  const k0=items.indexOf(item),line=el('div',{class:'dropline'});list.append(line);
  rowEls[k0].classList.add('dragging');
  let target=null;
  const calc=y=>{
    const lr=list.getBoundingClientRect();let k=items.length;
    for(let i=0;i<rowEls.length;i++){const r=rowEls[i].getBoundingClientRect();if(y<r.top+r.height/2){k=i;break}}
    const above=items[k-1],below=items[k];let gap,into=0;
    if(!below)gap=0;else gap=below.type==='layer'?below.i+1:below.top+1;
    if(item.type==='layer'&&above&&above.type==='group'&&!above.g.collapsed){into=above.g.id;gap=above.top+1}
    const yy=k<rowEls.length?rowEls[k].getBoundingClientRect().top-lr.top:rowEls[rowEls.length-1].getBoundingClientRect().bottom-lr.top;
    line.style.top=(yy-1+list.scrollTop)+'px';
    target={gap,into};
  };
  calc(e.clientY);
  const mv=ev=>calc(ev.clientY);
  const up=()=>{
    handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',cancel);
    line.remove();rowEls[k0]&&rowEls[k0].classList.remove('dragging');
    if(target)dragMove(item.type==='layer'?{layer:item.L,gap:target.gap,into:target.into}:{group:item.g,gap:target.gap});
  };
  const cancel=()=>{handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',cancel);line.remove();rowEls[k0]&&rowEls[k0].classList.remove('dragging')};
  handle.addEventListener('pointermove',mv);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',cancel);
}

function previewStroke(cv,cfg){
  const x=cv.getContext('2d'),w=cv.width,h=cv.height;x.clearRect(0,0,w,h);
  const sz=Math.min(cfg.size,h*.7),sc=sz/Math.max(cfg.size,1),stamp=makeStamp(sz,cfg.hardness,[110,116,130],tipKey(cfg));
  let rem=0,px=null;
  for(let i=0;i<=120;i++){
    const t=i/120,xx=14+t*(w-28),yy=h/2+Math.sin(t*Math.PI*2)*h*.22,pr=.25+.75*Math.sin(t*Math.PI);
    if(px){const d=Math.hypot(xx-px.x,yy-px.y);rem+=d;const step=Math.max(.7,sz*cfg.spacing);while(rem>=step){rem-=step;const s2=Math.max(.8,sz*(1-cfg.pSize+cfg.pSize*pr));let a=cfg.flow*(1-cfg.pOpa+cfg.pOpa*pr);if(cfg.grain)a*=1-cfg.grain*Math.random()*.9;x.globalAlpha=clamp(a*cfg.opacity,0,1);x.drawImage(stamp,xx-s2/2+(cfg.scatter?(Math.random()-.5)*sz*cfg.scatter:0),yy-s2/2,s2,s2)}}
    px={x:xx,y:yy};
  }
  x.globalAlpha=1;
}

    cfg.tip=cv.toDataURL('image/png');cfg.tipInv=false;saveBrushes();loadTip(cfg);renderSheet();toast('Ponta personalizada importada');
  }).catch(()=>toast('Não foi possível abrir a imagem'));
}

  else{const q=new Int32Array(N);let a=0,b=0;const push=i=>{if(!bg[i]&&isBg(i)){bg[i]=1;q[b++]=i}};
    for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
    while(a<b){const i=q[a++],x=i%w,y=(i-x)/w;if(x>0)push(i-1);if(x<w-1)push(i+1);if(y>0)push(i-w);if(y<h-1)push(i+w)}}

document.addEventListener('keydown',e=>{
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(e.target&&e.target.isContentEditable))return;
  if(modalClose)return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(mod){
    if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
    else if(k==='y'){e.preventDefault();redo()}
    else if(k==='s'){e.preventDefault();exportProject()}
    else if(k==='e'){e.preventDefault();exportImage('png')}
    else if(k==='o'){e.preventDefault();filePrj.click()}
    else if(k==='n'){e.preventDefault();e.shiftKey?addLayer():newDocDialog()}
    else if(k==='j'){e.preventDefault();duplicateLayer()}
    else if(k==='a'){e.preventDefault();selectAll()}
    else if(k==='d'){e.preventDefault();clearSelection()}
    else if(k==='i'&&e.shiftKey){e.preventDefault();invertSelection()}
    return;
  }
  if(e.altKey)return;
  if(k===' '){spaceDown=true;e.preventDefault();return}
  if(k==='tab'){if(S.clean){e.preventDefault();toggleClean(false)}return}
  if(k==='\\'){e.preventDefault();toggleClean();return}
  if(k==='?'||(k==='/'&&e.shiftKey)){showHelp();return}
  if(k==='escape'){
    if(S.clean){toggleClean(false);return}
    if(quickEl){closeQuickMenu();return}
    if(sheetName){closeSheet();return}
    if(S.float){cancelFloat();setTool('brush')}else if(S.sel)clearSelection();
    return;
  }
  if(k==='enter'&&S.float){applyFloat();setTool('brush');return}
  if((k==='delete'||k==='backspace')&&!S.float){e.preventDefault();clearLayer();return}
  if(KEY_TOOLS[k]){setTool(KEY_TOOLS[k]);return}
  if(k==='x'){swapColors();return}
  if(k==='0'){fitView();return}
  if(k==='['||k===']'){
    if(brushLike()){const c=sliderCfg();c.size=clamp(Math.round(c.size*(k===']'?1.15:.87)+(k===']'?1:-1)),1,400);updateSliders();saveBrushes();showSizePreview(c.size)}
